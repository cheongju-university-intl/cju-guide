<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>清州大学新生指南 | 首页导航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="home-page">
    <main class="home-shell">
        <section class="home-hero" aria-labelledby="home-title">
            <div class="home-brand-panel">
                <div class="home-logo" aria-label="清州大学标识">
                    <div class="home-logo-mark">
                        <i class="fas fa-university"></i>
                    </div>
                    <div>
                        <p class="home-logo-korean">청주대학교</p>
                        <p class="home-logo-english">CHEONGJU UNIVERSITY</p>
                    </div>
                </div>

                <p class="home-kicker">International Student Guide</p>
                <h1 id="home-title">清州大学<br>新生说明会导航</h1>
                <div class="home-quick-actions">
                    <a href="guide.html" class="home-primary-action"><i class="fas fa-book-open"></i>进入完整指南</a>
                    <a href="guide.html#sugang" class="home-secondary-action"><i class="fas fa-mouse-pointer"></i>直接看选课</a>
                </div>
            </div>

            <div class="home-nav-panel" aria-label="指南板块导航">
                <div class="home-panel-heading">
                    <div>
                        <span>选择板块</span>
                        <strong>点击想要查找的内容</strong>
                    </div>
                    <i class="fas fa-arrow-right"></i>
                </div>

                <div class="home-nav-grid">
                    <a href="guide.html#portal" class="home-nav-card">
                        <i class="fas fa-laptop-code"></i>
                        <span>综合情报系统</span>
                    </a>
                    <a href="guide.html#password-recovery" class="home-nav-card">
                        <i class="fas fa-key"></i>
                        <span>找回密码</span>
                    </a>
                    <a href="guide.html#schedule" class="home-nav-card">
                        <i class="fas fa-calendar-alt"></i>
                        <span>主要学事日程</span>
                    </a>
                    <a href="guide.html#personal-info" class="home-nav-card">
                        <i class="fas fa-user-edit"></i>
                        <span>个人信息修改</span>
                    </a>
                    <a href="guide.html#course-schedule" class="home-nav-card">
                        <i class="fas fa-table"></i>
                        <span>课程表查询</span>
                    </a>
                    <a href="guide.html#course-screening" class="home-nav-card">
                        <i class="fas fa-filter"></i>
                        <span>选课前筛选</span>
                    </a>
                    <a href="guide.html#sugang" class="home-nav-card featured">
                        <i class="fas fa-mouse-pointer"></i>
                        <span>选课指南</span>
                    </a>
                    <a href="guide.html#grad-credit" class="home-nav-card">
                        <i class="fas fa-graduation-cap"></i>
                        <span>毕业剩余学分</span>
                    </a>
                    <a href="guide.html#leave-request" class="home-nav-card">
                        <i class="fas fa-calendar-check"></i>
                        <span>请假申请</span>
                    </a>
                    <a href="guide.html#cert-print" class="home-nav-card">
                        <i class="fas fa-print"></i>
                        <span>打印证明</span>
                    </a>
                    <a href="guide.html#campus-map" class="home-nav-card featured">
                        <i class="fas fa-map-marked-alt"></i>
                        <span>学校地图与校车</span>
                    </a>
                    <a href="guide.html#online-class" class="home-nav-card">
                        <i class="fas fa-video"></i>
                        <span>网课与直播课</span>
                    </a>
                    <a href="guide.html#professor" class="home-nav-card">
                        <i class="fas fa-chalkboard-teacher"></i>
                        <span>教授联系方式</span>
                    </a>
                    <a href="guide.html#library" class="home-nav-card">
                        <i class="fas fa-book"></i>
                        <span>图书馆使用</span>
                    </a>
                    <a href="guide.html#arc" class="home-nav-card">
                        <i class="fas fa-id-card"></i>
                        <span>登陆证办理</span>
                    </a>
                    <a href="guide.html#activity" class="home-nav-card">
                        <i class="fas fa-users"></i>
                        <span>留学生活动</span>
                    </a>
                    <a href="guide.html#contact" class="home-nav-card">
                        <i class="fas fa-phone-alt"></i>
                        <span>联系方式与注意</span>
                    </a>
